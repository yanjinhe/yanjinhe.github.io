<line x1="300.7" y1="138.0" x2="438.0" y2="138.0" stroke="#cbd5e1" stroke-width="1.1" stroke-linecap="round" stroke-dasharray="2 4"/><text x="448" y="145.0" font-family="Georgia,'Times New Roman',Times,serif" font-size="21" font-style="italic" fill="#1d5fb4" paint-order="stroke" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">D<tspan font-size="0.62em" font-style="normal" dy="0.32em">SWIFT</tspan><tspan dy="-0.32em">&#8203;</tspan></text><text x="448" y="165.0" font-family="'Avenir Next','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="15" fill="#64748b" paint-order="stroke" stroke="#ffffff" stroke-width="4" stroke-linejoin="round">trained toward the SWIFT target</text>
