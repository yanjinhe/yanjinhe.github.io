<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 748 382" width="748" height="382" role="img" aria-labelledby="ex2d-title">
<title id="ex2d-title">Target extrapolation in two dimensions. Training from the initialization toward the posterior mean D-star stops short at D-weak, with residual v1. SWIFT extrapolates the target past D-star, away from D-weak. Training toward that target leaves a similar residual v2, so the learned D-SWIFT ends up closer to D-star.</title>
