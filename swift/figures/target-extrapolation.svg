<text x="315.0" y="119.0" font-family="Georgia,'Times New Roman',Times,serif" font-size="21" font-style="italic" fill="#d9771c">v<tspan font-size="0.62em" font-style="normal" dy="0.32em">1</tspan><tspan dy="-0.32em">&#8203;</tspan></text>
